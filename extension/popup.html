<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Teams Stay Green</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }
    .status-badge.connected {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }
    .status-badge.failed {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(15, 23, 42, 0.5);
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
    }
    select:focus, input:focus {
      outline: none;
      border-color: #6366f1;
    }
    .footer-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      box-sizing: border-box;
      text-decoration: none;
    }
    .btn-primary {
      background: #6366f1;
      color: #fff;
    }
    .btn-primary:hover {
      background: #4f46e5;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .info-box {
      font-size: 10px;
      color: #64748b;
      margin-top: 12px;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">Teams Stay Green</h1>
    <span class="status-badge" id="syncStatus">Waiting...</span>
  </div>

  <div class="form-group">
    <label for="targetState">Keep-Alive Status</label>
    <select id="targetState">
      <option value="Available">Available (Green)</option>
      <option value="Busy">Busy (Red)</option>
      <option value="DoNotDisturb">Do Not Disturb (Red)</option>
      <option value="BeRightBack">Be Right Back (Yellow)</option>
      <option value="Away">Away (Yellow)</option>
    </select>
  </div>

  <div class="form-group" style="display: none;">
    <label for="backendUrl">SaaS Server Endpoint</label>
    <input type="text" id="backendUrl" value="https://greenteam.himanshupatil.in">
  </div>

  <div class="form-group" style="margin-top: 8px;">
    <label>Last Synced Time</label>
    <span style="font-size: 12px; color: #cbd5e1;" id="syncTime">Never</span>
  </div>

  <div class="footer-actions">
    <button class="btn btn-primary" id="openTeams">💻 Open Teams Web</button>
    <button class="btn btn-secondary" id="saveConfig">💾 Save Configuration</button>
  </div>

  <div class="info-box">
    Open Teams Web to automatically capture and sync your token session with the backend.
  </div>

  <script src="popup.js"></script>
</body>
</html>
